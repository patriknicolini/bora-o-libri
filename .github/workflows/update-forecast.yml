name: Aggiorna dati OSMER (vento reale e bollettino bora)

on:
  schedule:
    # 04:30 e 10:30 UTC ≈ 06:30 e 12:30 in Italia (CEST); con l'ora solare
    # invernale diventano 05:30 e 11:30 locali — comunque due controlli al giorno.
    - cron: "30 4,10 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Scarica dati OSMER
        run: python .github/workflows/scripts/update_forecast.py

      - name: Commit e push se ci sono cambiamenti
        run: |
          git config user.name "bora-o-libri-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git diff --quiet --cached || git commit -m "Aggiorna dati OSMER (automatico)"
          git pull --rebase origin main
          git push
